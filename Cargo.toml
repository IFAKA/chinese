[package]
name = "chinese"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A small offline Mandarin learning CLI"

[[bin]]
name = "chinese"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
fsrs = "6.6.2"
pinyin = { version = "0.11.0", default-features = false, features = ["with_tone", "with_tone_num"] }
ratatui = "0.29"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.23"
